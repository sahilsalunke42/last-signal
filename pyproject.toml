[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "last-signal"
version = "0.1.0"
description = "Offline-first CLI for investigating failed AI-agent executions (Ghost in the Machine)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Last Signal Team"}
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
lastsignal = "lastsignal.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
